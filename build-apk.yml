name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'
    - name: Build
      run: |
        PROJ_DIR=$(find . -name "settings.gradle" -exec dirname {} \; | head -n 1)
        cd "$PROJ_DIR"
        gradle assembleDebug --no-daemon
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ertuta-galaxy-s-cift-kamera-apk
        path: "**/*.apk"
